name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # El sitio vive en https://<usuario>.github.io/<repositorio>/, por eso el --base.
      # VITE_API_URL sale de Settings → Secrets and variables → Actions → Variables; vacía = modo demo.
      - run: npm run build -- --base "/${{ github.event.repository.name }}/"
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # GitHub Pages responde 404.html en rutas desconocidas (/hoteles, /hotel/:slug...): así las atiende React Router.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
